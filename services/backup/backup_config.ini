# backup_config.ini
# Konfiguration für automatisierte Server- und Docker-Backups
#
# [mariadb] und [uploads] steuern die Sicherung der Standard-Dienste:
# - enabled: true / false
#
# Für Docker-Container stellt jede Sektion einen zu sichernden Dienst dar:
# - container: Der exakte Name des Docker-Containers.
# - volume: Der Name des Docker-Volumes oder ein absoluter Host-Pfad (Bind-Mount).
# - enabled: (Optional) true / false (Standard ist true, wenn weggelassen)
#
# Beispiel für ein Named Volume (aktiv):
# [portainer]
# enabled = true
# container = portainer
# volume = portainer_data
#
# Beispiel für einen deaktivierten Dienst (wird beim Backup übersprungen):
# [nextcloud]
# enabled = false
# container = nextcloud_app
# volume = /pfad/zu/nextcloud/data

[mariadb]
enabled = true

[uploads]
enabled = true

[portainer]
# enabled = true  # Optional: Auf false setzen, um diesen Container temporär zu pausieren
container = portainer
volume = portainer_portainer_data
