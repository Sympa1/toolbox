# ==============================================================================
# Konfiguration für den KDE Plasma Wallpaper Changer Dienst
# ==============================================================================

[wallpapers]
# Pfade zu den 4 Hintergrundbildern (unterstützt ~ für das Benutzerverzeichnis)
# Bitte passe diese Beispielpfade an deine tatsächlichen Bilddateien an.
morning = /pfad/zu/deinem/wallpaper_morning.jpg
day = /pfad/zu/deinem/wallpaper_day.jpg
evening = /pfad/zu/deinem/wallpaper_evening.jpg
night = /pfad/zu/deinem/wallpaper_night.jpg

[offsets]
# Zeitfenster in Minuten relativ zum Sonnenauf- bzw. Sonnenuntergang:
# Morgens: Startet X Minuten VOR Sonnenaufgang
morning_before_sunrise_minutes = 30
# Morgens: Endet X Minuten NACH Sonnenaufgang (danach startet 'day')
morning_after_sunrise_minutes = 60

# Abends: Startet X Minuten VOR Sonnenuntergang (ab hier endet 'day')
evening_before_sunset_minutes = 60
# Abends: Endet X Minuten NACH Sonnenuntergang (danach startet 'night')
evening_after_sunset_minutes = 30

[location]
# Standort automatisch anhand der externen IP ermitteln
auto_ip = true

# Cache-Dauer in Stunden, um IP-Dienste nicht zu überlasten (Standard: 24 Stunden)
cache_ttl_hours = 24

# Notfall-Koordinaten, falls keine Internetverbindung besteht und kein Cache existiert
fallback_latitude = 0.0
fallback_longitude = 0.0
fallback_city = ExampleCity
fallback_country = ExampleCountry

[general]
# Prüfintervall des Hintergrunddienstes in Sekunden (300 Sekunden = 5 Minuten)
check_interval_seconds = 300

# Ausführliches Logging (DEBUG, INFO, WARNING, ERROR)
log_level = INFO
